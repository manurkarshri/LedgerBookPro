<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LedgerBook Pro</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #070b14; --surface: #151923; --surface-2: #1d2230;
      --line: #2a3142; --text: #eef2ff; --muted: #a6adbb;
      --green: #22c55e; --red: #ff5b5b; --blue: #2ea3ff;
      --radius: 20px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px 16px 120px; }
    .hidden { display: none !important; }
    
    /* Header & Cards */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; border: 1px solid var(--line); }
    .card.full { grid-column: 1 / -1; }
    .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; }
    .value { font-size: 1.6rem; font-weight: 800; }

    /* Search Bar - Relocated */
    .search-wrap { margin: 15px 0; }
    .search-input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); padding: 14px; border-radius: 14px; color: white; font-size: 16px; outline: none; }

    /* Transaction List */
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--surface); border-radius: 16px; margin-bottom: 10px; border-left: 4px solid transparent; }
    .tx-item.expense { border-left-color: var(--red); }
    .tx-item.income { border-left-color: var(--green); }

    /* Modal Styling */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; align-items: flex-end; z-index: 1000; }
    .modal { width: 100%; background: #0d1118; border-radius: 30px 30px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--line); }
    
    /* Form Grid Fix (No overlap) */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
    .full { grid-column: 1 / -1; }
    input, select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: white; padding: 14px; border-radius: 12px; font-size: 16px; }
    
    .primary-btn { background: var(--blue); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; width: 100%; }
    .icon-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 12px; }

    /* PIN Lock UI */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .pin-btn { background: var(--surface-2); border: 1px solid var(--line); color: white; padding: 20px; border-radius: 16px; font-size: 1.4rem; font-weight: bold; }
    
    /* Insight & Attachment UI */
    .insight-box { background: rgba(46, 163, 255, 0.1); border: 1px solid var(--blue); padding: 15px; border-radius: 15px; margin: 20px 0; }
    .preview-img { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--line); }
  </style>
</head>
<body>

  <div id="lockScreen" class="modal-backdrop hidden" style="height: 100%; align-items: center; justify-content: center;">
    <div class="modal" style="text-align: center; border-radius: 28px; max-width: 400px; margin-bottom: 0; border: 1px solid var(--line);">
      <h2>Enter PIN</h2>
      <div id="pinDots" style="font-size: 2.5rem; margin: 20px 0; letter-spacing: 8px;">----</div>
      <div class="pin-pad" id="pinPadUI"></div>
      <button onclick="handleForgotPin()" style="background:none; border:none; color:var(--muted); margin-top:20px;">Forgot PIN?</button>
    </div>
  </div>

  <div id="mainView">
    <div class="topbar">
      <div><h1 style="margin:0; font-size: 1.8rem;">LedgerBook</h1><small style="color:var(--muted)">Pro Private Edition</small></div>
      <div style="display:flex; gap:10px;">
        <button class="icon-btn" onclick="openReports()">📊</button>
        <button class="icon-btn" onclick="toggleModal('settingsModal')">⚙️</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><div class="label">Income</div><div class="value green" id="incVal">₹0</div></div>
      <div class="card"><div class="label">Expense</div><div class="value red" id="expVal">₹0</div></div>
      <div class="card full" id="savingsCard"><div class="label">Net Savings</div><div class="value blue" id="savVal">₹0</div></div>
    </div>

    <h3 style="margin-bottom:0;">Transactions</h3>
    <div class="search-wrap">
      <input type="text" id="txSearch" class="search-input" placeholder="Search categories or notes..." oninput="filterTransactions()">
    </div>
    <div id="txList"></div>
  </div>

  <div id="entryModal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="modalTitle">New Entry</h2>
        <button class="icon-btn" onclick="toggleModal('entryModal')">✕</button>
      </div>
      <div class="form-grid">
        <div class="full">
          <select id="fType" onchange="syncOptions()">
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
          </select>
        </div>
        <div><span class="label">Date</span><input type="date" id="fDate"></div>
        <div><span class="label">Amount</span><input type="number" id="fAmount" placeholder="0.00"></div>
        <div class="full"><span class="label">Merchant</span><input type="text" id="fMerchant" placeholder="e.g. Amazon" onblur="runPredict()"></div>
        <div class="full"><span class="label">Category</span><select id="fCategory"></select></div>
        <div class="full"><span class="label">Payment Mode</span><select id="fPayment"></select></div>
        <div class="full"><span class="label">Note</span><textarea id="fNote" rows="2"></textarea></div>
        
        <div class="full">
          <span class="label">Receipt Photo</span>
          <input type="file" id="fPhoto" accept="image/*" style="padding: 10px;">
          <div id="photoPreview"></div>
        </div>

        <div class="full"><button class="primary-btn" onclick="saveData()">Save Transaction</button></div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>App Management</h2>
      <div style="display:grid; gap:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Monthly Budget (₹)</span>
          <input type="number" id="cfgBudget" style="width:120px;" onchange="saveConfig()">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Enable PIN Lock</span>
          <input type="checkbox" id="cfgPin" onchange="manageSecurity()" style="width:22px; height:22px;">
        </div>
        <button class="primary-btn" style="background:var(--surface-2); border:1px solid var(--line);" onclick="exportData()">📤 Export Data (JSON)</button>
        <button class="primary-btn" onclick="toggleModal('settingsModal')">Close</button>
      </div>
    </div>
  </div>

  <div id="reportsView" class="modal-backdrop hidden">
    <div class="modal" style="height: 100%; border-radius:0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Smart Insights</h2>
        <button class="icon-btn" onclick="toggleModal('reportsView')">✕</button>
      </div>
      <div id="insightText" class="insight-box">Generating analysis...</div>
      <div id="catSummary"></div>
    </div>
  </div>

  <button class="primary-btn" style="position:fixed; bottom:25px; left:5%; width:90%;" onclick="openEntry()">+ Add Entry</button>

  <script>
    let db, transactions = [], pinBuffer = "";
    const DB_NAME = 'LedgerDB';
    const STORE = 'transactions';

    // --- 1. DB & AUTO-UPDATE ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.onupdatefound = () => {
          const install = reg.installing;
          install.onstatechange = () => { if (install.state === 'installed' && navigator.serviceWorker.controller) window.location.reload(); };
        };
      });
    }

    const openDB = () => {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
        };
        req.onsuccess = e => resolve(e.target.result);
      });
    };

    // --- 2. CORE LOGIC ---
    const incomeCats = ['Salary', 'Dividends', 'Loan/Borrow', 'Interest', 'Gift', 'Other'];
    const expenseCats = ['Grocery', 'Rent', 'Fuel', 'Medical', 'Shopping', 'Dining', 'Bills', 'Other'];
    const incomeModes = ['Direct Deposit', 'UPI', 'Cash', 'Cheque', 'Bank Transfer'];
    const expenseModes = ['Cash', 'UPI', 'Credit Card', 'Debit Card', 'Net Banking'];

    function syncOptions() {
      const type = document.getElementById('fType').value;
      const cats = type === 'Income' ? incomeCats : expenseCats;
      const modes = type === 'Income' ? incomeModes : expenseModes;
      document.getElementById('fCategory').innerHTML = cats.map(c => `<option>${c}</option>`).join('');
      document.getElementById('fPayment').innerHTML = modes.map(m => `<option>${m}</option>`).join('');
    }

    async function renderAll() {
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      transactions = await new Promise(r => store.getAll().onsuccess = e => r(e.target.result));
      transactions.sort((a,b) => new Date(b.date) - new Date(a.date));

      let inc = 0, exp = 0;
      const list = document.getElementById('txList');
      list.innerHTML = "";

      transactions.forEach(t => {
        if(t.type === 'Income') inc += parseFloat(t.amount); else exp += parseFloat(t.amount);
        list.innerHTML += `
          <div class="tx-item ${t.type.toLowerCase()}" onclick="viewTx('${t.id}')">
            <div>
              <div style="font-weight:bold;">${t.merchant || t.category}</div>
              <small style="color:var(--muted)">${t.date}</small>
            </div>
            <div style="font-weight:bold;">${t.type === 'Income' ? '+' : '-'}₹${t.amount}</div>
          </div>`;
      });

      document.getElementById('incVal').textContent = `₹${inc}`;
      document.getElementById('expVal').textContent = `₹${exp}`;
      document.getElementById('savVal').textContent = `₹${inc - exp}`;
      
      checkBudget(exp);
    }

    // --- 3. SMART FEATURES ---
    function runPredict() {
      const m = document.getElementById('fMerchant').value.trim().toLowerCase();
      const match = transactions.find(t => t.merchant && t.merchant.toLowerCase() === m);
      if(match) {
        document.getElementById('fCategory').value = match.category;
        document.getElementById('fCategory').style.border = "1px solid var(--green)";
      }
    }

    function checkBudget(totalExp) {
      const b = parseFloat(localStorage.getItem('user_budget')) || 0;
      const card = document.getElementById('savingsCard');
      if(b > 0 && totalExp >= b) {
        card.style.borderColor = "var(--red)";
        card.querySelector('.label').textContent = "OVER BUDGET WARNING ⚠️";
      } else {
        card.style.borderColor = "var(--line)";
        card.querySelector('.label').textContent = "Net Savings";
      }
    }

    function openReports() {
      toggleModal('reportsView');
      const now = new Date();
      const thisMonth = transactions.filter(t => new Date(t.date).getMonth() === now.getMonth());
      const lastMonth = transactions.filter(t => new Date(t.date).getMonth() === now.getMonth() - 1);
      const curE = thisMonth.filter(t => t.type === 'Expense').reduce((a,b) => a + parseFloat(b.amount), 0);
      const preE = lastMonth.filter(t => t.type === 'Expense').reduce((a,b) => a + parseFloat(b.amount), 0);

      let msg = "Start logging for 2 months to see comparisons.";
      if(preE > 0) {
        const diff = ((curE - preE) / preE) * 100;
        msg = diff > 0 ? `Spending is up ${diff.toFixed(0)}% from last month.` : `Spending is down ${Math.abs(diff).toFixed(0)}% from last month.`;
      }
      document.getElementById('insightText').textContent = msg;
    }

    // --- 4. SECURITY (PIN & RECOVERY) ---
    function manageSecurity() {
      if(document.getElementById('cfgPin').checked) {
        const p = prompt("Set 4-Digit PIN:");
        const q = prompt("Security Q: What is your birth city?");
        if(p && q) {
          localStorage.setItem('app_pin', p);
          localStorage.setItem('sq_ans', q.toLowerCase().trim());
        }
      } else { localStorage.removeItem('app_pin'); }
    }

    function handleForgotPin() {
      const a = prompt("Security Q: What is your birth city?");
      if(a && a.toLowerCase().trim() === localStorage.getItem('sq_ans')) {
        alert("Your PIN is: " + localStorage.getItem('app_pin'));
      } else { alert("Wrong answer."); }
    }

    function initPinScreen() {
      const pin = localStorage.getItem('app_pin');
      if(!pin) return;
      document.getElementById('lockScreen').classList.remove('hidden');
      const pad = document.getElementById('pinPadUI');
      pad.innerHTML = "";
      [1,2,3,4,5,6,7,8,9,'C',0,'OK'].forEach(v => {
        const b = document.createElement('button'); b.className = "pin-btn"; b.textContent = v;
        b.onclick = () => {
          if(v === 'C') pinBuffer = "";
          else if(v === 'OK') {
            if(pinBuffer === localStorage.getItem('app_pin')) document.getElementById('lockScreen').classList.add('hidden');
            else { alert("Wrong PIN"); pinBuffer = ""; }
          } else pinBuffer += v;
          document.getElementById('pinDots').textContent = "*".repeat(pinBuffer.length) || "----";
        };
        pad.appendChild(b);
      });
    }

    // --- 5. DATA ACTIONS ---
    async function saveData() {
      const photoFile = document.getElementById('fPhoto').files[0];
      let photoBase64 = "";
      if(photoFile) {
        photoBase64 = await new Promise(r => {
          const reader = new FileReader();
          reader.onload = e => r(e.target.result);
          reader.readAsDataURL(photoFile);
        });
      }

      const entry = {
        id: Date.now().toString(),
        type: document.getElementById('fType').value,
        date: document.getElementById('fDate').value,
        amount: document.getElementById('fAmount').value,
        merchant: document.getElementById('fMerchant').value,
        category: document.getElementById('fCategory').value,
        payment: document.getElementById('fPayment').value,
        note: document.getElementById('fNote').value,
        photo: photoBase64
      };

      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).add(entry);
      tx.oncomplete = () => { toggleModal('entryModal'); renderAll(); };
    }

    function openEntry() { toggleModal('entryModal'); document.getElementById('fDate').valueAsDate = new Date(); syncOptions(); }
    function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
    function saveConfig() { localStorage.setItem('user_budget', document.getElementById('cfgBudget').value); renderAll(); }
    
    // --- INIT ---
    openDB().then(d => { 
      db = d; 
      renderAll(); 
      initPinScreen();
      document.getElementById('cfgBudget').value = localStorage.getItem('user_budget') || "";
      document.getElementById('cfgPin').checked = !!localStorage.getItem('app_pin');
    });
  </script>
</body>
</html>
