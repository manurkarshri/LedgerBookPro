<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LedgerBook Pro</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #070b14; --surface: #151923; --surface-2: #1d2230;
      --line: #2a3142; --text: #eef2ff; --muted: #a6adbb;
      --green: #22c55e; --red: #ff5b5b; --blue: #2ea3ff;
      --radius: 20px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 20px 16px 120px; line-height: 1.4; }
    .hidden { display: none !important; }
    
    /* Header */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .dev-credit { color: var(--muted); font-size: 0.85rem; font-weight: 500; margin-top: -4px; display: block; }

    /* Dashboard Cards */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; transition: 0.3s; }
    .card.full { grid-column: 1 / -1; }
    .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 4px; display: block; }
    
    .val-inc { color: var(--green); font-size: 1.6rem; font-weight: 800; }
    .val-exp { color: var(--red); font-size: 1.6rem; font-weight: 800; }
    .val-sav { color: var(--blue); font-size: 1.6rem; font-weight: 800; }

    /* Transaction Item */
    .tx-item { background: var(--surface); border: 1px solid var(--line); padding: 16px; border-radius: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .tx-info { display: flex; flex-direction: column; gap: 2px; }
    .tx-meta { font-size: 0.8rem; color: var(--muted); }

    /* Modal & Form Fixes */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: flex; align-items: flex-end; z-index: 1000; }
    .modal { width: 100%; background: #0d1118; border-radius: 30px 30px 0 0; padding: 24px; max-height: 92vh; overflow-y: auto; border-top: 1px solid var(--line); }
    
    /* NO OVERLAP GRID */
    .flex-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
    .flex-item { flex: 1 1 140px; min-width: 0; } /* Forces wrapping if screen is too narrow */
    
    input, select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: white; padding: 14px; border-radius: 14px; font-size: 16px; outline: none; }
    input:focus { border-color: var(--blue); }

    .primary-btn { background: var(--blue); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: 700; width: 100%; font-size: 1rem; margin-top: 10px; }
    .icon-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .voice-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--blue); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

    /* PIN UI */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .pin-btn { background: var(--surface-2); border: 1px solid var(--line); color: white; padding: 22px; border-radius: 18px; font-size: 1.5rem; font-weight: bold; }
    
    #photoPreview img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }
  </style>
</head>
<body>

  <div id="lockScreen" class="modal-backdrop hidden" style="height: 100%; align-items: center; justify-content: center;">
    <div class="modal" style="text-align: center; border-radius: 32px; max-width: 400px; border: 1px solid var(--line);">
      <h2>Secure Access</h2>
      <div id="pinDots" style="font-size: 2.5rem; margin: 20px 0; letter-spacing: 10px; color: var(--blue);">----</div>
      <div class="pin-pad" id="pinPad"></div>
      <button onclick="forgotPinFlow()" style="background:none; border:none; color:var(--muted); margin-top:25px; font-size: 0.9rem;">Forgot PIN?</button>
    </div>
  </div>

  <div id="mainApp">
    <div class="topbar">
      <div>
        <h1 style="margin:0; font-size: 1.8rem; letter-spacing: -0.5px;">LedgerBook</h1>
        <span class="dev-credit">Shriganesh Manurkar</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="icon-btn" onclick="openReports()">📊</button>
        <button class="icon-btn" onclick="toggleModal('settingsModal')">⚙️</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><span class="label">Income</span><div class="val-inc" id="hInc">₹0</div></div>
      <div class="card"><span class="label">Expense</span><div class="val-exp" id="hExp">₹0</div></div>
      <div class="card full" id="budgetCard"><span class="label">Net Savings</span><div class="val-sav" id="hSav">₹0</div></div>
    </div>

    <input type="text" id="txSearch" class="search-input" placeholder="🔍 Search transactions..." oninput="renderApp()">
    <div id="txList"></div>
  </div>

  <div id="entryModal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 id="modalTitle">Add Entry</h2>
        <div style="display:flex; gap:10px;">
          <button class="voice-btn" onclick="runVoice()">🎤</button>
          <button class="icon-btn" onclick="closeEntry()">✕</button>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <select id="fType" onchange="syncUI()">
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
        </select>
      </div>

      <div class="flex-row">
        <div class="flex-item">
          <span class="label">Date</span>
          <input type="date" id="fDate">
        </div>
        <div class="flex-item">
          <span class="label">Amount</span>
          <input type="number" id="fAmount" placeholder="0.00" inputmode="decimal">
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <span class="label">Merchant / Source</span>
        <input type="text" id="fMerchant" placeholder="e.g. Amazon, Salary" onblur="predictCat()">
      </div>

      <div class="flex-row">
        <div class="flex-item">
          <span class="label">Category</span>
          <select id="fCategory"></select>
        </div>
        <div class="flex-item">
          <span class="label">Payment Mode</span>
          <select id="fPayment"></select>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <span class="label">Notes</span>
        <textarea id="fNote" rows="2" placeholder="Optional details..."></textarea>
      </div>

      <div style="margin-bottom:20px;">
        <span class="label">Receipt Image</span>
        <input type="file" id="fPhoto" accept="image/*">
        <div id="photoPreview"></div>
      </div>

      <input type="hidden" id="editingId">
      <button class="primary-btn" id="saveBtn" onclick="handleSave()">Save Transaction</button>
      <button id="delBtn" class="primary-btn hidden" style="background:var(--red); margin-top:10px;" onclick="handleDelete()">Delete Entry</button>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>Settings</h2>
      <div style="display:grid; gap:20px; margin-top:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Monthly Budget (₹)</span>
          <input type="number" id="setBudget" style="width:120px;" onchange="saveConfig()">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>PIN Lock</span>
          <input type="checkbox" id="setPin" onchange="securitySetup()" style="width:22px; height:22px;">
        </div>
        <button class="primary-btn" style="background:var(--surface-2);" onclick="exportJSON()">📤 Backup Data</button>
        <button class="primary-btn" onclick="toggleModal('settingsModal')">Close</button>
      </div>
    </div>
  </div>

  <button class="primary-btn" style="position:fixed; bottom:25px; left:5%; width:90%; z-index:900;" onclick="openEntry()">+ New Transaction</button>

  <script>
    let db, transactions = [], pinEntry = "";
    const incCats = ['Salary', 'Dividends', 'Loan/Borrow', 'Interest', 'Gift', 'Other'];
    const expCats = ['Grocery', 'Rent', 'Fuel', 'Medical', 'Shopping', 'Dining', 'Bills', 'Other'];
    const incModes = ['Direct Deposit', 'UPI', 'Cash', 'Cheque', 'Bank Transfer'];
    const expModes = ['Cash', 'UPI', 'Credit Card', 'Debit Card', 'Net Banking'];

    // --- DB SETUP ---
    async function initDB() {
      return new Promise(r => {
        const req = indexedDB.open('LedgerProDB', 3);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if(!db.objectStoreNames.contains('tx')) db.createObjectStore('tx', {keyPath:'id'});
        };
        req.onsuccess = e => r(e.target.result);
      });
    }

    // --- UI ENGINE ---
    async function renderApp() {
      const search = document.getElementById('txSearch').value.toLowerCase();
      const store = db.transaction('tx','readonly').objectStore('tx');
      transactions = await new Promise(r => store.getAll().onsuccess = e => r(e.target.result));
      transactions.sort((a,b) => new Date(b.date) - new Date(a.date));

      let i=0, e=0;
      const list = document.getElementById('txList');
      list.innerHTML = "";

      transactions.forEach(t => {
        if(!t.merchant.toLowerCase().includes(search) && !t.category.toLowerCase().includes(search)) return;
        if(t.type === 'Income') i += parseFloat(t.amount); else e += parseFloat(t.amount);
        
        list.innerHTML += `
          <div class="tx-item" onclick="openEdit('${t.id}')">
            <div class="tx-info">
              <span style="font-weight:700;">${t.merchant || t.category}</span>
              <span class="tx-meta">${t.date} • ${t.payment}</span>
            </div>
            <div style="color: var(--${t.type === 'Income'?'green':'red'}); font-weight:800; font-size:1.1rem;">
              ${t.type === 'Income'?'+':'-'}₹${t.amount}
            </div>
          </div>`;
      });

      document.getElementById('hInc').textContent = `₹${i}`;
      document.getElementById('hExp').textContent = `₹${e}`;
      document.getElementById('hSav').textContent = `₹${i-e}`;
      
      const budget = parseFloat(localStorage.getItem('app_budget')) || 0;
      document.getElementById('budgetCard').style.borderColor = (budget > 0 && e >= budget) ? 'var(--red)' : 'var(--line)';
    }

    function syncUI() {
      const type = document.getElementById('fType').value;
      const cats = type === 'Income' ? incCats : expCats;
      const modes = type === 'Income' ? incModes : expModes;
      document.getElementById('fCategory').innerHTML = cats.map(c => `<option>${c}</option>`).join('');
      document.getElementById('fPayment').innerHTML = modes.map(m => `<option>${m}</option>`).join('');
    }

    function runPredict() {
      const m = document.getElementById('fMerchant').value.trim().toLowerCase();
      const match = transactions.find(t => t.merchant.toLowerCase() === m);
      if(match) {
        document.getElementById('fCategory').value = match.category;
        document.getElementById('fCategory').style.border = '2px solid var(--green)';
      }
    }

    // --- ACTIONS ---
    async function handleSave() {
      const photoInput = document.getElementById('fPhoto');
      let base64 = "";
      if(photoInput.files[0]) {
        base64 = await new Promise(r => {
          const reader = new FileReader();
          reader.onload = e => r(e.target.result);
          reader.readAsDataURL(photoInput.files[0]);
        });
      }

      const id = document.getElementById('editingId').value || Date.now().toString();
      const entry = {
        id,
        type: document.getElementById('fType').value,
        date: document.getElementById('fDate').value,
        amount: document.getElementById('fAmount').value,
        merchant: document.getElementById('fMerchant').value,
        category: document.getElementById('fCategory').value,
        payment: document.getElementById('fPayment').value,
        note: document.getElementById('fNote').value,
        photo: base64 || (id ? transactions.find(t => t.id === id)?.photo : "")
      };

      const tx = db.transaction('tx', 'readwrite');
      tx.objectStore('tx').put(entry);
      tx.oncomplete = () => { closeEntry(); renderApp(); };
    }

    function openEdit(id) {
      const t = transactions.find(x => x.id === id);
      document.getElementById('modalTitle').textContent = "Edit Entry";
      document.getElementById('editingId').value = t.id;
      document.getElementById('fType').value = t.type;
      syncUI();
      document.getElementById('fDate').value = t.date;
      document.getElementById('fAmount').value = t.amount;
      document.getElementById('fMerchant').value = t.merchant;
      document.getElementById('fCategory').value = t.category;
      document.getElementById('fPayment').value = t.payment;
      document.getElementById('fNote').value = t.note;
      document.getElementById('delBtn').classList.remove('hidden');
      toggleModal('entryModal');
    }

    function handleDelete() {
      const id = document.getElementById('editingId').value;
      if(confirm("Delete this entry?")) {
        const tx = db.transaction('tx', 'readwrite');
        tx.objectStore('tx').delete(id);
        tx.oncomplete = () => { closeEntry(); renderApp(); };
      }
    }

    function openEntry() {
      document.getElementById('modalTitle').textContent = "Add Entry";
      document.getElementById('editingId').value = "";
      document.getElementById('fDate').valueAsDate = new Date();
      document.getElementById('delBtn').classList.add('hidden');
      syncUI();
      toggleModal('entryModal');
    }

    function closeEntry() { toggleModal('entryModal'); document.getElementById('fCategory').style.border = ""; }
    function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
    function saveConfig() { localStorage.setItem('app_budget', document.getElementById('setBudget').value); renderApp(); }

    // --- SECURITY ---
    function securitySetup() {
      if(document.getElementById('setPin').checked) {
        const p = prompt("New 4-Digit PIN:");
        const q = prompt("Security Q: What is your birth city?");
        if(p && q) {
          localStorage.setItem('app_pin', p);
          localStorage.setItem('app_q', q.toLowerCase().trim());
        }
      } else localStorage.removeItem('app_pin');
    }

    function forgotPinFlow() {
      const a = prompt("Security Q: What is your birth city?");
      if(a && a.toLowerCase().trim() === localStorage.getItem('app_q')) alert("Your PIN: " + localStorage.getItem('app_pin'));
    }

    function runLock() {
      const pin = localStorage.getItem('app_pin');
      if(!pin) return;
      document.getElementById('lockScreen').classList.remove('hidden');
      const pad = document.getElementById('pinPad');
      pad.innerHTML = "";
      [1,2,3,4,5,6,7,8,9,'C',0,'OK'].forEach(v => {
        const b = document.createElement('button'); b.className = "pin-btn"; b.textContent = v;
        b.onclick = () => {
          if(v==='C') pinEntry = "";
          else if(v==='OK') {
            if(pinEntry === localStorage.getItem('app_pin')) document.getElementById('lockScreen').classList.add('hidden');
            else { alert("Wrong PIN"); pinEntry = ""; }
          } else pinEntry += v;
          document.getElementById('pinDots').textContent = "*".repeat(pinEntry.length) || "----";
        };
        pad.appendChild(b);
      });
    }

    function runVoice() {
      const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      rec.lang = 'en-IN'; rec.start();
      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        const amt = text.match(/\d+/);
        if(amt) document.getElementById('fAmount').value = amt[0];
        alert("Heard: " + text);
      };
    }

    initDB().then(d => { db = d; renderApp(); runLock(); });
  </script>
</body>
</html>
